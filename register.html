
<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Εγγραφή Καθαριστή | ATHENS NOW</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172b4d;
    }
    header {
      background: #102c54;
      color: white;
      padding: 25px;
      text-align: center;
    }
    header h1 { margin: 0; }
    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 25px #00000012;
    }
    h2 { text-align: center; }
    p { line-height: 1.5; }
    label {
      display: block;
      margin-top: 17px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 110px; }
    .price {
      background: #e9f7ef;
      padding: 15px;
      border-radius: 9px;
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
    button {
      background: #087f5b;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 15px;
      width: 100%;
      font-size: 17px;
      margin-top: 22px;
      cursor: pointer;
    }
    .notice { font-size: 13px; color: #64748b; }
    footer { text-align: center; padding: 25px; }
  </style>
</head>
<body>
  <header>
    <h1>ATHENS NOW</h1>
    <p>Cleaning Services Platform</p>
  </header>

  <main>
    <h2>Γίνε συνεργάτης μας</h2>
    <p>Δημιούργησε το επαγγελματικό σου προφίλ
       και βρες πελάτες στην Αθήνα.</p>

    <form id="registration">
      <label for="name">Ονοματεπώνυμο</label>
      <input id="name" required placeholder="Το όνομά σου">

      <label for="type">Τύπος συνεργάτη</label>
      <select id="type">
        <option>Ανεξάρτητος καθαριστής</option>
        <option>Συνεργείο ATHENS NOW</option>
      </select>

      <label for="area">Περιοχές εξυπηρέτησης</label>
      <input id="area" required placeholder="π.χ. Γλυφάδα, Αθήνα">

      <label for="experience">Εμπειρία</label>
      <select id="experience">
        <option>Χωρίς προηγούμενη εμπειρία</option>
        <option>1–2 χρόνια</option>
        <option>3–5 χρόνια</option>
        <option>Πάνω από 5 χρόνια</option>
      </select>

      <label for="bio">Βιογραφικό</label>
      <textarea id="bio" required
        placeholder="Πες μας για την εμπειρία σου"></textarea>

      <label for="photo">Φωτογραφία προφίλ</label>
      <input id="photo" type="file" accept="image/*">

      <div class="price">
        Ενιαία χρέωση: 10€/ώρα<br>
        Ελάχιστη κράτηση: 3 ώρες
      </div>

      <p class="notice">
        Δοκιμαστική φόρμα. Δεν αποθηκεύονται
        ούτε αποστέλλονται προσωπικά δεδομένα.
      </p>

      <button type="submit">Προεπισκόπηση εγγραφής</button>
    </form>
  </main>

  <footer>
    <a href="index.html">Επιστροφή στην αρχική</a>
    <p>© 2026 ATHENS NOW</p>
  </footer>

  <script>
    document.getElementById("registration")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        alert("Η δοκιμαστική φόρμα λειτουργεί! " +
              "Η πραγματική εγγραφή θα προστεθεί αργότερα.");
      });
  </script>
</body>
</html>
